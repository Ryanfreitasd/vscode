name: Build Univertix Exam Shield Windows Portable

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/vscode-portable-monitor

jobs:
  build-windows:
    runs-on: windows-2022
    name: Build Windows x64 Portable
    env:
      npm_config_arch: x64
      npm_config_foreground_scripts: "true"
      VSCODE_ARCH: x64
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      VSCODE_SKIP_NODE_VERSION_CHECK: 1
      vs2022_install: "C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = "Stop"

          # Run preinstall script to download Electron/v8 headers
          exec { node build/npm/preinstall.ts }

          for ($i = 1; $i -le 5; $i++) {
            try {
              exec { npm ci }
              break
            }
            catch {
              if ($i -eq 5) {
                Write-Error "npm ci failed after 5 attempts"
                throw
              }
              Write-Host "npm ci failed attempt $i, retrying..."
              Start-Sleep -Seconds 2
            }
          }

      - name: Compile Windows Portable VS Code
        shell: pwsh
        run: |
          node scripts/build-portable-vscode.mjs win32

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Univertix-VSCode-win32-x64-portable
          path: |
            Univertix-VSCode-win32-x64-portable.zip
            ../Univertix-VSCode-win32-x64-portable.zip
          retention-days: 14
